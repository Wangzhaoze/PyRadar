name: CI

on:
  push:
    branches: [main, "codex/**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install
        run: python -m pip install -e ".[test]"
      - name: Test
        run: python -m pytest

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install -e ".[test]"
      - run: ruff check pyradar tests docs/examples
      - run: mypy pyradar
      - name: Core coverage
        run: >-
          python -m pytest
          --cov=pyradar/base
          --cov=pyradar/rsp
          --cov-report=term-missing
          --cov-fail-under=90

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install -e ".[docs]"
      - run: python -m sphinx -W --keep-going -b html docs docs/_build/html

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install build twine
      - run: python -m build
      - run: python -m twine check dist/*
      - name: Reject non-package content in wheel
        run: |
          python -m zipfile -l dist/*.whl | tee wheel-contents.txt
          ! grep -E "(archieves|pyradar_sandbox|tests/|examples/data|egg-info)" wheel-contents.txt
      - name: Clean install
        run: |
          python -m venv clean-env
          clean-env/bin/python -m pip install dist/*.whl
          clean-env/bin/python -c "import pyradar; print(pyradar.__version__)"
